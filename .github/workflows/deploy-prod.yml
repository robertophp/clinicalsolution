# Corre los tests y despliega el servicio Cloud Run de producción al hacer push a la rama `main`.
# El job `deploy` depende de `test`: si un test falla, no se construye ni se despliega imagen.
# Este servicio (clinicalsolution-prod) no existe todavía en GCP: `gcloud run deploy` lo crea
# automáticamente la primera vez que corre este workflow, no hace falta crearlo a mano.
#
# Usa el GitHub Environment "production" (Settings → Environments; recomendado: exigir
# revisor/aprobación manual antes de que corra el job `deploy` acá). La mayoría de los
# secretos (GCP_*, META_*) son los mismos en dev y prod: basta con dejarlos como Repository
# secrets. Solo INTERNAL_API_KEY y DASHBOARD_SESSION_SECRET conviene que tengan un valor
# DISTINTO al de dev — defínelos dentro del Environment "production" para que el valor
# scoped al environment gane sobre el de repo. Ver docs/DEPLOYMENT_ENVIRONMENTS.md.
#   Obligatorios:
#     GCP_PROJECT_ID
#     GCP_REGION                 (ej. us-central1)
#     GCP_SA_KEY                 JSON de cuenta de servicio (deploy: Run Admin, AR Writer, SA User)
#     META_WHATSAPP_ACCESS_TOKEN
#     META_APP_SECRET
#     META_WEBHOOK_VERIFY_TOKEN
#     INTERNAL_API_KEY           obligatorio en producción (ver api/startup_checks.py) — si
#                                 falta, el contenedor arranca y muere solo
#   Recomendado:
#     GCP_RUN_SERVICE_ACCOUNT    email de la SA que ejecuta Cloud Run (Vertex, BQ, Firestore)
#     DASHBOARD_SESSION_SECRET   si no existe, el login del dashboard de métricas queda deshabilitado

name: Deploy PROD (Cloud Run)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AR_REPOSITORY: clinicalsolution
  CLOUD_RUN_SERVICE: clinicalsolution-prod

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        env:
          REGION: ${{ secrets.GCP_REGION }}
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${{ env.AR_REPOSITORY }}/api:${IMAGE_TAG}"
          docker build -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run (PROD)
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ secrets.GCP_REGION }}
          META_WHATSAPP_ACCESS_TOKEN: ${{ secrets.META_WHATSAPP_ACCESS_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_WEBHOOK_VERIFY_TOKEN: ${{ secrets.META_WEBHOOK_VERIFY_TOKEN }}
          INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          DASHBOARD_SESSION_SECRET: ${{ secrets.DASHBOARD_SESSION_SECRET }}
          GCP_RUN_SERVICE_ACCOUNT: ${{ secrets.GCP_RUN_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          ENV_VARS="APP_ENV=production"
          ENV_VARS="${ENV_VARS},PROJECT_ID=${PROJECT_ID}"
          ENV_VARS="${ENV_VARS},LOCATION=${REGION}"
          ENV_VARS="${ENV_VARS},BIGQUERY_DATASET=cita_datos_prod"
          ENV_VARS="${ENV_VARS},FIRESTORE_DATABASE_ID=agentmemory-prod"
          ENV_VARS="${ENV_VARS},META_WEBHOOK_SKIP_SIGNATURE_VERIFY=false"
          ENV_VARS="${ENV_VARS},META_WHATSAPP_ACCESS_TOKEN=${META_WHATSAPP_ACCESS_TOKEN}"
          ENV_VARS="${ENV_VARS},META_APP_SECRET=${META_APP_SECRET}"
          ENV_VARS="${ENV_VARS},META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN}"
          ENV_VARS="${ENV_VARS},INTERNAL_API_KEY=${INTERNAL_API_KEY}"
          if [ -n "${DASHBOARD_SESSION_SECRET}" ]; then
            ENV_VARS="${ENV_VARS},DASHBOARD_SESSION_SECRET=${DASHBOARD_SESSION_SECRET}"
          fi

          DEPLOY=(gcloud run deploy "${CLOUD_RUN_SERVICE}"
            --project="${PROJECT_ID}"
            --region="${REGION}"
            --image="${IMAGE}"
            --platform=managed
            --allow-unauthenticated
            --port=8080
            --memory=1Gi
            --timeout=300
            --min-instances=0
            --max-instances=3
            --set-env-vars="${ENV_VARS}")

          if [ -n "${GCP_RUN_SERVICE_ACCOUNT}" ]; then
            DEPLOY+=(--service-account="${GCP_RUN_SERVICE_ACCOUNT}")
          fi

          "${DEPLOY[@]}"
